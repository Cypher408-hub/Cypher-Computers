<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laptops — Cypher IT Solutions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="products.js"></script>
<script src="cart.js"></script>
<script src="account-nav.js"></script>
<style>
  :root{
    --paper:#EDEAE2; --paper-2:#E2DDD0; --ink:#1A1B17; --ink-soft:#54564E;
    --orange:#FF5A1F; --orange-deep:#D6480F; --steel:#2F5A7A;
    --display:'Archivo Black',sans-serif; --sans:'IBM Plex Sans',sans-serif; --mono:'IBM Plex Mono',monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.55;}
  a{color:inherit;text-decoration:none;}

  nav{display:flex;justify-content:space-between;align-items:center;padding:18px 5vw;border-bottom:2px solid var(--ink);position:sticky;top:0;z-index:100;background:var(--paper);}
  .logo{font-family:var(--display);font-size:1.1rem;display:flex;align-items:center;gap:10px;}
  .nav-links{display:flex;gap:28px;font-family:var(--mono);font-size:0.76rem;text-transform:uppercase;letter-spacing:0.04em;}
  .nav-links a{position:relative;padding-bottom:3px;}
  .nav-links a::after{content:'';position:absolute;left:0;bottom:0;width:0;height:2px;background:var(--orange);transition:width 0.25s;}
  .nav-links a:hover::after,.nav-links a.active::after{width:100%;}
  .nav-right{display:flex;align-items:center;gap:16px;}
  .nav-link-auth{font-family:var(--mono);font-size:0.76rem;text-transform:uppercase;color:var(--ink-soft);}
  .nav-cta{font-family:var(--mono);font-size:0.76rem;text-transform:uppercase;border:2px solid var(--ink);padding:8px 16px;}
  .nav-cta:hover{background:var(--ink);color:var(--paper);}
  .cart-link{position:relative;font-family:var(--mono);font-size:0.76rem;text-transform:uppercase;display:flex;align-items:center;gap:6px;}
  .cart-badge{display:none;position:absolute;top:-8px;right:-12px;background:var(--orange);color:var(--paper);font-size:0.65rem;font-weight:600;min-width:18px;height:18px;border-radius:50%;align-items:center;justify-content:center;}
  .openBtn{background:none;border:none;cursor:pointer;font-size:1.1rem;color:var(--ink);}

  .page-head{padding:48px 5vw 28px;border-bottom:2px solid var(--ink);}
  .breadcrumb{font-family:var(--mono);font-size:0.74rem;color:var(--steel);text-transform:uppercase;margin-bottom:12px;}
  .breadcrumb a:hover{color:var(--orange-deep);}
  h1{font-family:var(--display);font-size:clamp(1.7rem,3.5vw,2.4rem);text-transform:uppercase;}

  .filter-bar{display:flex;gap:10px;flex-wrap:wrap;padding:16px 5vw;border-bottom:2px solid var(--ink);position:sticky;top:64px;background:var(--paper);z-index:50;}
  .filter-chip{font-family:var(--mono);font-size:0.72rem;text-transform:uppercase;padding:8px 14px;border:1.5px solid var(--ink);background:transparent;cursor:pointer;}
  .filter-chip.active,.filter-chip:hover{background:var(--ink);color:var(--paper);}
  .sort-select{margin-left:auto;font-family:var(--mono);font-size:0.72rem;border:1.5px solid var(--ink);padding:8px 12px;background:transparent;}

  main{padding:36px 5vw 80px;}
  .result-count{font-family:var(--mono);font-size:0.76rem;color:var(--steel);margin-bottom:22px;text-transform:uppercase;}

  .item-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:2px solid var(--ink);border-left:2px solid var(--ink);}
  .item-card{border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);background:var(--paper);display:flex;flex-direction:column;}
  .item-card:hover{background:var(--paper-2);}
  .item-img{aspect-ratio:1;background-size:cover;background-position:center;position:relative;border-bottom:2px solid var(--ink);}
  .item-badge{position:absolute;top:10px;left:10px;background:var(--ink);color:var(--paper);font-family:var(--mono);font-size:0.62rem;padding:4px 9px;text-transform:uppercase;}
  .item-badge.flash{background:var(--orange);}
  .discount-flag{position:absolute;top:10px;right:10px;background:var(--orange);color:var(--paper);font-family:var(--mono);font-weight:600;font-size:0.68rem;padding:4px 8px;}
  .item-body{padding:16px 18px;display:flex;flex-direction:column;flex:1;}
  .item-brand{font-family:var(--mono);font-size:0.65rem;color:var(--steel);text-transform:uppercase;margin-bottom:4px;}
  .item-name{font-family:var(--display);font-size:1rem;text-transform:uppercase;line-height:1.2;}
  .item-spec{font-family:var(--mono);font-size:0.74rem;color:var(--ink-soft);margin-top:8px;line-height:1.6;flex:1;}
  .item-rating{font-family:var(--mono);font-size:0.72rem;color:var(--ink-soft);margin-top:8px;}
  .item-rating .stars{color:var(--orange);}
  .item-foot{margin-top:14px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;}
  .price-old{font-family:var(--mono);font-size:0.72rem;color:var(--ink-soft);text-decoration:line-through;}
  .price-new{font-family:var(--mono);font-size:1.05rem;font-weight:600;color:var(--orange-deep);}
  .add-btn{font-family:var(--mono);font-size:0.68rem;text-transform:uppercase;background:var(--ink);color:var(--paper);border:none;padding:9px 12px;cursor:pointer;}
  .add-btn:hover{background:var(--orange);}

  footer{padding:24px 5vw;display:flex;justify-content:space-between;font-family:var(--mono);font-size:0.72rem;color:var(--ink-soft);text-transform:uppercase;border-top:2px solid var(--ink);}

  .overlay{height:100%;width:100%;display:none;position:fixed;z-index:200;top:0;left:0;background:rgba(0,0,0,0.92);}
  .overlay-content{position:relative;top:40%;width:80%;max-width:700px;margin:auto;}
  .overlay .closebtn{position:absolute;top:24px;right:40px;font-size:48px;cursor:pointer;color:#fff;}
  .site-search-form{display:flex;}
  .site-search-form input{flex:1;padding:16px;font-size:1.1rem;border:none;}
  .site-search-form button{width:70px;padding:16px;background:var(--orange);border:none;color:#fff;cursor:pointer;}

  @media (max-width:880px){.nav-links{display:none;}.item-grid{grid-template-columns:1fr 1fr;}.filter-bar{top:60px;overflow-x:auto;}footer{flex-direction:column;gap:8px;text-align:center;}}
  @media (max-width:520px){.item-grid{grid-template-columns:1fr;}}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="logo">
    <svg width="28" height="28" viewBox="0 0 30 30" fill="none"><rect x="1" y="1" width="28" height="28" stroke="#1A1B17" stroke-width="2"/><path d="M20 8H12C9.79086 8 8 9.79086 8 12V18C8 20.2091 9.79086 22 12 22H20" stroke="#1A1B17" stroke-width="2.4" stroke-linecap="square"/><circle cx="21.5" cy="8.5" r="2" fill="#FF5A1F"/><circle cx="21.5" cy="21.5" r="2" fill="#FF5A1F"/></svg>
    CYPHER IT SOLUTIONS
  </a>
  <div class="nav-links">
    <a href="laptop.html" class="active">Laptops</a>
    <a href="phones.html">Phones</a>
    <a href="accessories.html">Accessories</a>
    <a href="index.html#repairs">Repairs</a>
  </div>
  <div class="nav-right">
    <button class="openBtn" onclick="openSearch()"><i class="fa fa-search"></i></button>
    <a href="cart.html" class="cart-link"><i class="fa fa-shopping-cart"></i> Cart <span class="cart-badge"></span></a>
    <a href="login.html" class="nav-link-auth">Login</a>
    <a href="signup.html" class="nav-cta">Sign Up</a>
  </div>
</nav>

<div id="myOverlay" class="overlay">
  <span class="closebtn" onclick="closeSearch()">×</span>
  <div class="overlay-content">
    <form action="search.html" method="GET" class="site-search-form">
      <input type="text" placeholder="Search products..." name="q" required>
      <button type="submit"><i class="fa fa-search"></i></button>
    </form>
  </div>
</div>

<div class="page-head">
  <div class="breadcrumb"><a href="index.html">Home</a> / Laptops</div>
  <h1>Laptops</h1>
</div>

<div class="filter-bar">
  <button class="filter-chip active" data-filter="all">All</button>
  <button class="filter-chip" data-filter="HP">HP</button>
  <button class="filter-chip" data-filter="Dell">Dell</button>
  <button class="filter-chip" data-filter="Apple">Apple</button>
  <button class="filter-chip" data-filter="Lenovo">Lenovo</button>
  <button class="filter-chip" data-filter="under3000">Under GHS 3,000</button>
  <button class="filter-chip" data-filter="deal">On Deal</button>
  <select class="sort-select" id="sort">
    <option value="default">Sort: Featured</option>
    <option value="price-asc">Price: Low to High</option>
    <option value="price-desc">Price: High to Low</option>
    <option value="rating">Top Rated</option>
  </select>
</div>

<main>
  <div class="result-count" id="result-count"></div>
  <div class="item-grid" id="product-grid"></div>
</main>

<footer>
  <span>© 2026 Cypher IT Solutions</span>
  <span>Ashanti Region, Ghana</span>
</footer>

<script>
function openSearch(){ document.getElementById("myOverlay").style.display = "block"; }
function closeSearch(){ document.getElementById("myOverlay").style.display = "none"; }

let currentFilter = "all";
let currentSort = "default";

function getProducts() {
  let list = CypherProducts.getByCategory("laptops");
  if (currentFilter === "under3000") list = list.filter(p => p.price < 3000);
  else if (currentFilter === "deal") list = list.filter(p => p.oldPrice && p.oldPrice > p.price);
  else if (currentFilter !== "all") list = list.filter(p => p.brand === currentFilter);

  if (currentSort === "price-asc") list.sort((a,b) => a.price - b.price);
  else if (currentSort === "price-desc") list.sort((a,b) => b.price - a.price);
  else if (currentSort === "rating") list.sort((a,b) => b.rating - a.rating);
  return list;
}

function render() {
  const list = getProducts();
  document.getElementById("result-count").textContent = list.length + " product" + (list.length !== 1 ? "s" : "");
  document.getElementById("product-grid").innerHTML = list.map(p => {
    const disc = p.oldPrice ? Math.round((1 - p.price / p.oldPrice) * 100) : 0;
    return `
      <div class="item-card">
        <a href="product.html?id=${p.id}" class="item-img" style="background-image:url('${p.image}');display:block;">
          ${p.badge ? `<div class="item-badge ${p.badge==='Flash Sale'?'flash':''}">${p.badge}</div>` : ""}
          ${disc > 0 ? `<div class="discount-flag">-${disc}%</div>` : ""}
        </a>
        <div class="item-body">
          <div class="item-brand">${p.brand}</div>
          <a href="product.html?id=${p.id}" class="item-name">${p.name}</a>
          <div class="item-spec">${p.specs}<br>${p.condition}</div>
          <div class="item-rating"><span class="stars">★</span> ${p.rating} (${p.reviews})</div>
          <div class="item-foot">
            <div>
              ${p.oldPrice ? `<div class="price-old">${CypherProducts.formatPrice(p.oldPrice)}</div>` : ""}
              <div class="price-new">${CypherProducts.formatPrice(p.price)}</div>
            </div>
            <button class="add-btn" onclick="event.preventDefault();addToCart('${p.id}')">Add to Cart</button>
          </div>
        </div>
      </div>`;
  }).join("");
}

function addToCart(id) {
  if (CypherCart.addItem(id, 1)) CypherCart.showToast("Added to cart");
}

document.querySelectorAll(".filter-chip").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".filter-chip").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentFilter = btn.dataset.filter;
    render();
  });
});
document.getElementById("sort").addEventListener("change", e => {
  currentSort = e.target.value;
  render();
});

document.addEventListener("DOMContentLoaded", render);
</script>
</body>
</html>
