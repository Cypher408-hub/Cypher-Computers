<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search — Cypher IT Solutions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="products.js"></script>
<script src="cart.js"></script>
<script src="account-nav.js"></script>
<script src="back-to-top.js" defer></script>
<style>
  :root{--paper:#EDEAE2;--paper-2:#E2DDD0;--ink:#1A1B17;--ink-soft:#54564E;--orange:#FF5A1F;--orange-deep:#D6480F;--steel:#2F5A7A;--display:'Archivo Black',sans-serif;--sans:'IBM Plex Sans',sans-serif;--mono:'IBM Plex Mono',monospace;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.55;}
  a{color:inherit;text-decoration:none;}
  nav{display:flex;justify-content:space-between;align-items:center;padding:18px 5vw;border-bottom:2px solid var(--ink);position:sticky;top:0;z-index:100;background:var(--paper);}
  .logo{font-family:var(--display);font-size:1.1rem;display:flex;align-items:center;gap:10px;}
  .nav-links{display:flex;gap:28px;font-family:var(--mono);font-size:0.76rem;text-transform:uppercase;}
  .nav-links a{position:relative;padding-bottom:3px;}
  .nav-links a::after{content:'';position:absolute;left:0;bottom:0;width:0;height:2px;background:var(--orange);transition:width 0.25s;}
  .nav-links a:hover::after{width:100%;}
  .nav-right{display:flex;align-items:center;gap:16px;}
  .nav-link-auth{font-family:var(--mono);font-size:0.76rem;text-transform:uppercase;color:var(--ink-soft);}
  .nav-cta{font-family:var(--mono);font-size:0.76rem;text-transform:uppercase;border:2px solid var(--ink);padding:8px 16px;}
  .nav-cta:hover{background:var(--ink);color:var(--paper);}
  .cart-link{position:relative;font-family:var(--mono);font-size:0.76rem;text-transform:uppercase;display:flex;align-items:center;gap:6px;}
  .cart-badge{display:none;position:absolute;top:-8px;right:-12px;background:var(--orange);color:var(--paper);font-size:0.65rem;font-weight:600;min-width:18px;height:18px;border-radius:50%;align-items:center;justify-content:center;}
  .page-head{padding:48px 5vw 28px;border-bottom:2px solid var(--ink);}
  .breadcrumb{font-family:var(--mono);font-size:0.74rem;color:var(--steel);text-transform:uppercase;margin-bottom:12px;}
  h1{font-family:var(--display);font-size:clamp(1.5rem,3vw,2.2rem);text-transform:uppercase;}
  .search-box{margin-top:20px;display:flex;max-width:520px;border:2px solid var(--ink);}
  .search-box input{flex:1;padding:12px 16px;border:none;background:transparent;font-size:1rem;outline:none;}
  .search-box button{padding:12px 20px;background:var(--orange);border:none;color:#fff;cursor:pointer;font-family:var(--mono);text-transform:uppercase;}
  main{padding:36px 5vw 80px;}
  .result-count{font-family:var(--mono);font-size:0.76rem;color:var(--steel);margin-bottom:22px;text-transform:uppercase;}
  .item-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:2px solid var(--ink);border-left:2px solid var(--ink);}
  .item-card{border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);background:var(--paper);display:flex;flex-direction:column;}
  .item-img{aspect-ratio:1;background-size:cover;background-position:center;position:relative;border-bottom:2px solid var(--ink);}
  .item-badge{position:absolute;top:10px;left:10px;background:var(--ink);color:var(--paper);font-family:var(--mono);font-size:0.62rem;padding:4px 9px;text-transform:uppercase;}
  .discount-flag{position:absolute;top:10px;right:10px;background:var(--orange);color:var(--paper);font-family:var(--mono);font-weight:600;font-size:0.68rem;padding:4px 8px;}
  .item-body{padding:16px 18px;display:flex;flex-direction:column;flex:1;}
  .item-brand{font-family:var(--mono);font-size:0.65rem;color:var(--steel);text-transform:uppercase;margin-bottom:4px;}
  .item-name{font-family:var(--display);font-size:1rem;text-transform:uppercase;}
  .item-spec{font-family:var(--mono);font-size:0.74rem;color:var(--ink-soft);margin-top:8px;flex:1;}
  .item-foot{margin-top:14px;display:flex;justify-content:space-between;align-items:flex-end;}
  .price-new{font-family:var(--mono);font-size:1.05rem;font-weight:600;color:var(--orange-deep);}
  .price-old{font-family:var(--mono);font-size:0.72rem;color:var(--ink-soft);text-decoration:line-through;}
  .add-btn{font-family:var(--mono);font-size:0.68rem;text-transform:uppercase;background:var(--ink);color:var(--paper);border:none;padding:9px 12px;cursor:pointer;}
  .add-btn:hover{background:var(--orange);}
  .empty{text-align:center;padding:60px 20px;color:var(--ink-soft);}
  footer{padding:24px 5vw;display:flex;justify-content:space-between;font-family:var(--mono);font-size:0.72rem;color:var(--ink-soft);text-transform:uppercase;border-top:2px solid var(--ink);}

  @media (max-width:880px){
    .nav-links{display:none;}
    .item-grid{
      display:flex;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;
      scroll-snap-type:x mandatory;border-top:2px solid var(--ink);border-left:none;border-bottom:2px solid var(--ink);
    }
    .item-card{
      flex:0 0 46%;max-width:220px;min-width:160px;border-left:2px solid var(--ink);
      border-right:none;border-bottom:none;scroll-snap-align:start;
    }
    .item-body{padding:10px 12px;}
    .item-name{font-size:0.78rem;}
    .item-spec{font-size:0.62rem;-webkit-line-clamp:2;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden;}
    .price-new{font-size:0.88rem;}
    .add-btn{padding:6px 8px;font-size:0.6rem;}
    footer{flex-direction:column;gap:8px;text-align:center;}
  }
  @media (max-width:520px){
    .item-card{flex:0 0 42%;max-width:170px;min-width:140px;}
    .add-btn{width:100%;text-align:center;}
  }

</style>
</head>
<body>
<nav>
  <a href="index.html" class="logo">
    <svg width="28" height="28" viewBox="0 0 30 30" fill="none"><rect x="1" y="1" width="28" height="28" stroke="#1A1B17" stroke-width="2"/><path d="M20 8H12C9.79086 8 8 9.79086 8 12V18C8 20.2091 9.79086 22 12 22H20" stroke="#1A1B17" stroke-width="2.4" stroke-linecap="square"/><circle cx="21.5" cy="8.5" r="2" fill="#FF5A1F"/><circle cx="21.5" cy="21.5" r="2" fill="#FF5A1F"/></svg>
    CYPHER IT SOLUTIONS
  </a>
  <div class="nav-links">
    <a href="laptop.html">Laptops</a>
    <a href="phones.html">Phones</a>
    <a href="accessories.html">Accessories</a>
    <a href="index.html#repairs">Repairs</a>
  </div>
  <div class="nav-right">
    <a href="cart.html" class="cart-link"><i class="fa fa-shopping-cart"></i> Cart <span class="cart-badge"></span></a>
    <a href="login.html" class="nav-link-auth">Login</a>
    <a href="signup.html" class="nav-cta">Sign Up</a>
  </div>
</nav>
<div class="page-head">
  <div class="breadcrumb"><a href="index.html">Home</a> / Search</div>
  <h1>Search</h1>
  <form class="search-box" onsubmit="doSearch(event)">
    <input type="text" id="q" placeholder="Search phones, laptops, accessories..." autocomplete="off">
    <button type="submit">Search</button>
  </form>
</div>
<main>
  <div class="result-count" id="result-count"></div>
  <div class="item-grid" id="product-grid"></div>
  <div class="empty" id="empty" style="display:none;">No products matched your search.</div>
</main>
<footer>
  <span>© 2026 Cypher IT Solutions</span>
  <span>Ashanti Region, Ghana</span>
</footer>
<script>
function addToCart(id){ if(CypherCart.addItem(id,1)) CypherCart.showToast("Added to cart"); }
function doSearch(e){
  if(e) e.preventDefault();
  const q = (document.getElementById("q").value || "").trim().toLowerCase();
  const params = new URLSearchParams(window.location.search);
  if(q){ params.set("q", q); history.replaceState(null,"","?" + params.toString()); }
  let list = CypherProducts.slice();
  if(q){
    list = list.filter(p =>
      p.name.toLowerCase().includes(q) ||
      p.brand.toLowerCase().includes(q) ||
      p.category.toLowerCase().includes(q) ||
      (p.specs||"").toLowerCase().includes(q)
    );
  }
  document.getElementById("result-count").textContent = list.length + " result" + (list.length!==1?"s":"") + (q ? ' for "' + q + '"' : "");
  const grid = document.getElementById("product-grid");
  const empty = document.getElementById("empty");
  if(!list.length){ grid.innerHTML=""; empty.style.display="block"; return; }
  empty.style.display="none";
  grid.innerHTML = list.map(p => {
    const disc = p.oldPrice ? Math.round((1-p.price/p.oldPrice)*100) : 0;
    return '<div class="item-card"><a href="product.html?id='+p.id+'" class="item-img" style="background-image:url(\''+p.image+'\');display:block;">' +
      (p.badge?'<div class="item-badge">'+p.badge+'</div>':'') +
      (disc>0?'<div class="discount-flag">-'+disc+'%</div>':'') +
      '</a><div class="item-body"><div class="item-brand">'+p.brand+'</div><a href="product.html?id='+p.id+'" class="item-name">'+p.name+'</a>' +
      '<div class="item-spec">'+p.specs+'</div><div class="item-foot"><div>' +
      (p.oldPrice?'<div class="price-old">'+CypherProducts.formatPrice(p.oldPrice)+'</div>':'') +
      '<div class="price-new">'+CypherProducts.formatPrice(p.price)+'</div></div>' +
      '<button class="add-btn" onclick="event.preventDefault();addToCart(\''+p.id+'\')">Add to Cart</button></div></div></div>';
  }).join("");
}
document.addEventListener("DOMContentLoaded", function(){
  const params = new URLSearchParams(window.location.search);
  const q = params.get("q") || "";
  document.getElementById("q").value = q;
  doSearch();
});
</script>
</body>
</html>
