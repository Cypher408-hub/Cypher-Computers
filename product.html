<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product — Cypher IT Solutions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script src="api.js"></script>
<script src="products.js"></script>
<script src="cart.js"></script>
<script src="account-nav.js"></script>
<script src="back-to-top.js" defer></script>
<style>
  :root{
    --paper:#EDEAE2; --paper-2:#E2DDD0; --ink:#1A1B17; --ink-soft:#54564E;
    --orange:#FF5A1F; --orange-deep:#D6480F; --steel:#2F5A7A;
    --display:'Archivo Black',sans-serif; --sans:'IBM Plex Sans',sans-serif; --mono:'IBM Plex Mono',monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.55;}
  a{color:inherit;text-decoration:none;}

  nav{display:flex;justify-content:space-between;align-items:center;padding:18px 5vw;border-bottom:2px solid var(--ink);position:sticky;top:0;z-index:100;background:var(--paper);}
  .logo{font-family:var(--display);font-size:1.1rem;display:flex;align-items:center;gap:10px;}
  .nav-links{display:flex;gap:28px;font-family:var(--mono);font-size:0.76rem;text-transform:uppercase;letter-spacing:0.04em;}
  .nav-links a{position:relative;padding-bottom:3px;}
  .nav-links a::after{content:'';position:absolute;left:0;bottom:0;width:0;height:2px;background:var(--orange);transition:width 0.25s;}
  .nav-links a:hover::after{width:100%;}
  .nav-right{display:flex;align-items:center;gap:16px;}
  .nav-link-auth{font-family:var(--mono);font-size:0.76rem;text-transform:uppercase;color:var(--ink-soft);}
  .nav-cta{font-family:var(--mono);font-size:0.76rem;text-transform:uppercase;border:2px solid var(--ink);padding:8px 16px;}
  .nav-cta:hover{background:var(--ink);color:var(--paper);}
  .cart-link{position:relative;font-family:var(--mono);font-size:0.76rem;text-transform:uppercase;display:flex;align-items:center;gap:6px;}
  .cart-badge{display:none;position:absolute;top:-8px;right:-12px;background:var(--orange);color:var(--paper);font-size:0.65rem;font-weight:600;min-width:18px;height:18px;border-radius:50%;align-items:center;justify-content:center;}
  .openBtn{background:none;border:none;cursor:pointer;font-size:1.1rem;color:var(--ink);}

  .breadcrumb-bar{padding:16px 5vw;font-family:var(--mono);font-size:0.74rem;color:var(--steel);text-transform:uppercase;border-bottom:2px solid var(--ink);}
  .breadcrumb-bar a:hover{color:var(--orange-deep);}

  .product-layout{
    display:grid;grid-template-columns:1fr 1fr;gap:0;
    border-bottom:2px solid var(--ink);min-height:60vh;
  }
  .product-gallery{
    border-right:2px solid var(--ink);background:var(--paper-2);
    display:flex;flex-direction:column;padding:28px 28px 24px;
    position:relative;min-height:420px;gap:16px;
  }
  .gallery-main{
    flex:1;display:flex;align-items:center;justify-content:center;
    position:relative;min-height:340px;background:var(--paper);
    border:1.5px solid var(--ink);
  }
  .gallery-main img{
    max-width:100%;max-height:420px;object-fit:contain;display:block;
    transition:opacity 0.2s;
  }
  .gallery-thumbs{
    display:flex;gap:10px;flex-wrap:wrap;justify-content:center;
  }
  .gallery-thumb{
    width:72px;height:72px;border:2px solid var(--ink);padding:0;cursor:pointer;
    background-size:cover;background-position:center;background-color:var(--paper);
    flex-shrink:0;opacity:0.75;transition:opacity 0.15s, border-color 0.15s;
  }
  .gallery-thumb:hover{opacity:1;}
  .gallery-thumb.active{opacity:1;border-color:var(--orange);box-shadow:inset 0 0 0 1px var(--orange);}
  .gallery-nav{
    position:absolute;top:50%;transform:translateY(-50%);
    width:40px;height:40px;border:2px solid var(--ink);background:var(--paper);
    font-family:var(--mono);font-size:1.1rem;cursor:pointer;z-index:2;
    display:flex;align-items:center;justify-content:center;
  }
  .gallery-nav:hover{background:var(--ink);color:var(--paper);}
  .gallery-nav.prev{left:12px;}
  .gallery-nav.next{right:12px;}
  .gallery-badge{
    position:absolute;top:16px;left:16px;background:var(--ink);color:var(--paper);
    font-family:var(--mono);font-size:0.7rem;padding:6px 12px;text-transform:uppercase;z-index:2;
  }
  .gallery-badge.flash{background:var(--orange);}
  .gallery-discount{
    position:absolute;top:16px;right:16px;background:var(--orange);color:var(--paper);
    font-family:var(--mono);font-weight:600;font-size:0.85rem;padding:6px 12px;z-index:2;
  }
  .gallery-count{
    position:absolute;bottom:12px;right:12px;font-family:var(--mono);font-size:0.7rem;
    background:rgba(26,27,23,0.75);color:var(--paper);padding:4px 10px;z-index:2;
  }

  .product-info{padding:48px 5vw 48px 40px;display:flex;flex-direction:column;justify-content:center;}
  .product-brand{font-family:var(--mono);font-size:0.72rem;color:var(--steel);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px;}
  .product-title{font-family:var(--display);font-size:clamp(1.6rem,3.5vw,2.4rem);text-transform:uppercase;line-height:1.1;margin-bottom:12px;}
  .product-rating{font-family:var(--mono);font-size:0.82rem;color:var(--ink-soft);margin-bottom:18px;}
  .product-rating .stars{color:var(--orange);}
  .product-condition{
    display:inline-block;font-family:var(--mono);font-size:0.72rem;text-transform:uppercase;
    border:1.5px solid var(--ink);padding:5px 12px;margin-bottom:20px;
  }
  .price-row{display:flex;align-items:baseline;gap:14px;margin-bottom:8px;}
  .price-new{font-family:var(--mono);font-size:1.6rem;font-weight:600;color:var(--orange-deep);}
  .price-old{font-family:var(--mono);font-size:1rem;color:var(--ink-soft);text-decoration:line-through;}
  .stock-line{font-family:var(--mono);font-size:0.78rem;color:var(--steel);margin-bottom:24px;}
  .stock-line.in{color:#2d6a4f;}
  .stock-line.low{color:var(--orange-deep);}
  .stock-line.out{color:#9b2226;}

  .product-desc{font-size:0.98rem;color:var(--ink-soft);max-width:480px;margin-bottom:28px;line-height:1.65;}

  .qty-row{display:flex;align-items:center;gap:16px;margin-bottom:20px;flex-wrap:wrap;}
  .qty-control{display:flex;align-items:center;border:2px solid var(--ink);}
  .qty-control button{
    width:40px;height:40px;background:transparent;border:none;cursor:pointer;
    font-family:var(--mono);font-size:1.1rem;color:var(--ink);
  }
  .qty-control button:hover{background:var(--ink);color:var(--paper);}
  .qty-control input{
    width:48px;height:40px;text-align:center;border:none;border-left:2px solid var(--ink);border-right:2px solid var(--ink);
    font-family:var(--mono);font-size:0.95rem;background:transparent;color:var(--ink);
  }
  .btn-add{
    font-family:var(--mono);font-size:0.85rem;text-transform:uppercase;letter-spacing:0.04em;
    background:var(--orange);color:var(--paper);padding:14px 32px;border:2px solid var(--orange);
    cursor:pointer;transition:all 0.2s;
  }
  .btn-add:hover{background:transparent;color:var(--orange-deep);}
  .btn-add:disabled{opacity:0.5;cursor:not-allowed;}
  .btn-whatsapp{
    font-family:var(--mono);font-size:0.8rem;text-transform:uppercase;
    border:2px solid var(--ink);padding:12px 22px;display:inline-flex;align-items:center;gap:8px;
    transition:all 0.2s;
  }
  .btn-whatsapp:hover{background:var(--ink);color:var(--paper);}

  .specs-section{padding:48px 5vw;border-bottom:2px solid var(--ink);}
  .section-title{font-family:var(--display);font-size:1.3rem;text-transform:uppercase;margin-bottom:24px;}
  .specs-table{width:100%;max-width:700px;border-collapse:collapse;border:2px solid var(--ink);}
  .specs-table tr{border-bottom:1px solid rgba(26,27,23,0.15);}
  .specs-table tr:last-child{border-bottom:none;}
  .specs-table td{padding:14px 18px;font-size:0.92rem;}
  .specs-table td:first-child{
    font-family:var(--mono);font-size:0.78rem;text-transform:uppercase;color:var(--steel);
    width:40%;background:var(--paper-2);border-right:1px solid rgba(26,27,23,0.15);
  }

  .related-section{padding:48px 5vw 70px;}
  .related-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:2px solid var(--ink);border-left:2px solid var(--ink);}
  .related-card{border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);background:var(--paper);display:flex;flex-direction:column;}
  .related-card:hover{background:var(--paper-2);}
  .related-img{aspect-ratio:1;background-size:cover;background-position:center;border-bottom:2px solid var(--ink);}
  .related-body{padding:14px 16px;}
  .related-name{font-family:var(--display);font-size:0.9rem;text-transform:uppercase;}
  .related-price{font-family:var(--mono);font-size:0.95rem;font-weight:600;color:var(--orange-deep);margin-top:6px;}

  .not-found{padding:100px 5vw;text-align:center;}
  .not-found h1{font-family:var(--display);font-size:1.8rem;text-transform:uppercase;margin-bottom:12px;}
  .not-found a{color:var(--orange-deep);font-family:var(--mono);text-transform:uppercase;font-size:0.85rem;}

  footer{padding:24px 5vw;display:flex;justify-content:space-between;font-family:var(--mono);font-size:0.72rem;color:var(--ink-soft);text-transform:uppercase;border-top:2px solid var(--ink);}

  .overlay{height:100%;width:100%;display:none;position:fixed;z-index:200;top:0;left:0;background:rgba(0,0,0,0.92);}
  .overlay-content{position:relative;top:40%;width:80%;max-width:700px;margin:auto;}
  .overlay .closebtn{position:absolute;top:24px;right:40px;font-size:48px;cursor:pointer;color:#fff;}
  .site-search-form{display:flex;}
  .site-search-form input{flex:1;padding:16px;font-size:1.1rem;border:none;}
  .site-search-form button{width:70px;padding:16px;background:var(--orange);border:none;color:#fff;cursor:pointer;}

  @media (max-width:880px){
    .nav-links{display:none;}
    .product-layout{grid-template-columns:1fr;}
    .product-gallery{border-right:none;border-bottom:2px solid var(--ink);min-height:300px;}
    .product-info{padding:32px 5vw;}
    .related-grid{grid-template-columns:1fr 1fr;}
    footer{flex-direction:column;gap:8px;text-align:center;}
  }
  @media (max-width:520px){.related-grid{grid-template-columns:1fr;}}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="logo">
    <svg width="28" height="28" viewBox="0 0 30 30" fill="none"><rect x="1" y="1" width="28" height="28" stroke="#1A1B17" stroke-width="2"/><path d="M20 8H12C9.79086 8 8 9.79086 8 12V18C8 20.2091 9.79086 22 12 22H20" stroke="#1A1B17" stroke-width="2.4" stroke-linecap="square"/><circle cx="21.5" cy="8.5" r="2" fill="#FF5A1F"/><circle cx="21.5" cy="21.5" r="2" fill="#FF5A1F"/></svg>
    CYPHER IT SOLUTIONS
  </a>
  <div class="nav-links">
    <a href="laptop.html">Laptops</a>
    <a href="phones.html">Phones</a>
    <a href="accessories.html">Accessories</a>
    <a href="index.html#repairs">Repairs</a>
  </div>
  <div class="nav-right">
    <button class="openBtn" onclick="openSearch()"><i class="fa fa-search"></i></button>
    <a href="cart.html" class="cart-link"><i class="fa fa-shopping-cart"></i> Cart <span class="cart-badge"></span></a>
    <a href="login.html" class="nav-link-auth">Login</a>
    <a href="signup.html" class="nav-cta">Sign Up</a>
  </div>
</nav>

<div id="myOverlay" class="overlay">
  <span class="closebtn" onclick="closeSearch()">×</span>
  <div class="overlay-content">
    <form action="search.html" method="GET" class="site-search-form">
      <input type="text" placeholder="Search products..." name="q" required>
      <button type="submit"><i class="fa fa-search"></i></button>
    </form>
  </div>
</div>

<div id="page-content"></div>

<footer>
  <span>© 2026 Cypher IT Solutions</span>
  <span>Ashanti Region, Ghana</span>
</footer>

<script>
function openSearch(){ document.getElementById("myOverlay").style.display = "block"; }
function closeSearch(){ document.getElementById("myOverlay").style.display = "none"; }

function getQty() {
  return Math.max(1, parseInt(document.getElementById("qty-input").value, 10) || 1);
}

function changeQty(delta) {
  const input = document.getElementById("qty-input");
  const max = parseInt(input.max, 10) || 99;
  let v = (parseInt(input.value, 10) || 1) + delta;
  if (v < 1) v = 1;
  if (v > max) v = max;
  input.value = v;
}

function addToCart(id) {
  const qty = getQty();
  if (CypherCart.addItem(id, qty)) {
    CypherCart.showToast("Added " + qty + " to cart");
  }
}

function renderProduct(p) {
  document.title = p.name + " — Cypher IT Solutions";
  const disc = p.oldPrice ? Math.round((1 - p.price / p.oldPrice) * 100) : 0;
  const catLabel = p.category.charAt(0).toUpperCase() + p.category.slice(1);
  const catPage = p.category === "laptops" ? "laptop.html" : p.category === "phones" ? "phones.html" : "accessories.html";

  let stockClass = "in", stockText = p.stock + " in stock";
  if (p.stock === 0) { stockClass = "out"; stockText = "Out of stock"; }
  else if (p.stock <= 5) { stockClass = "low"; stockText = "Only " + p.stock + " left"; }

  let specsRows = "";
  if (p.fullSpecs) {
    for (const [k, v] of Object.entries(p.fullSpecs)) {
      specsRows += "<tr><td>" + k + "</td><td>" + v + "</td></tr>";
    }
  }

  const imgs = (CypherProducts.getImages ? CypherProducts.getImages(p) : null)
    || (Array.isArray(p.images) && p.images.length ? p.images : [p.image].filter(Boolean));
  window._galleryImgs = imgs;
  window._galleryIndex = 0;

  const thumbsHtml = imgs.map((src, i) =>
    `<button type="button" class="gallery-thumb${i === 0 ? " active" : ""}" style="background-image:url('${src}')" data-idx="${i}" onclick="setGalleryImage(${i})" aria-label="Photo ${i + 1}"></button>`
  ).join("");

  const navHtml = imgs.length > 1
    ? `<button type="button" class="gallery-nav prev" onclick="shiftGallery(-1)" aria-label="Previous">&#10094;</button>
       <button type="button" class="gallery-nav next" onclick="shiftGallery(1)" aria-label="Next">&#10095;</button>
       <div class="gallery-count" id="gallery-count">1 / ${imgs.length}</div>`
    : "";

  const related = CypherProducts.getRelated(p, 4);
  const relatedHtml = related.map(r => `
    <a href="product.html?id=${r.id}" class="related-card">
      <div class="related-img" style="background-image:url('${r.image}')"></div>
      <div class="related-body">
        <div class="related-name">${r.name}</div>
        <div class="related-price">${CypherProducts.formatPrice(r.price)}</div>
      </div>
    </a>
  `).join("");

  document.getElementById("page-content").innerHTML = `
    <div class="breadcrumb-bar">
      <a href="index.html">Home</a> / <a href="${catPage}">${catLabel}</a> / ${p.name}
    </div>

    <div class="product-layout">
      <div class="product-gallery">
        <div class="gallery-main">
          <img id="gallery-main-img" src="${imgs[0] || ""}" alt="${p.name}">
          ${p.badge ? `<div class="gallery-badge ${p.badge === "Flash Sale" ? "flash" : ""}">${p.badge}</div>` : ""}
          ${disc > 0 ? `<div class="gallery-discount">-${disc}%</div>` : ""}
          ${navHtml}
        </div>
        ${imgs.length > 1 ? `<div class="gallery-thumbs">${thumbsHtml}</div>` : ""}
      </div>
      <div class="product-info">
        <div class="product-brand">${p.brand}</div>
        <h1 class="product-title">${p.name}</h1>
        <div class="product-rating"><span class="stars">★</span> ${p.rating} · ${p.reviews} reviews</div>
        <div class="product-condition">${p.condition}</div>
        <div class="price-row">
          <span class="price-new">${CypherProducts.formatPrice(p.price)}</span>
          ${p.oldPrice ? `<span class="price-old">${CypherProducts.formatPrice(p.oldPrice)}</span>` : ""}
        </div>
        <div class="stock-line ${stockClass}">${stockText}</div>
        <p class="product-desc">${p.description || p.specs}</p>
        <div class="qty-row">
          <div class="qty-control">
            <button type="button" onclick="changeQty(-1)">−</button>
            <input type="number" id="qty-input" value="1" min="1" max="${Math.max(1, p.stock)}">
            <button type="button" onclick="changeQty(1)">+</button>
          </div>
          <button class="btn-add" onclick="addToCart('${p.id}')" ${p.stock < 1 ? "disabled" : ""}>
            ${p.stock < 1 ? "Out of Stock" : "Add to Cart"}
          </button>
        </div>
        <a class="btn-whatsapp" href="${(window.CypherConfig ? CypherConfig.waLink("Hi, I'm interested in: " + p.name + " (" + CypherProducts.formatPrice(p.price) + ")") : "https://wa.me/233241557271")}" target="_blank" rel="noopener">
          <i class="fa fa-whatsapp"></i> Ask on WhatsApp
        </a>
        <p class="wa-number-hint" style="margin-top:10px;font-family:var(--mono);font-size:0.72rem;color:var(--ink-soft);line-height:1.7;">
          Call / WhatsApp:<br>
          <a href="${window.CypherConfig ? CypherConfig.telLink() : "tel:+233204078079"}" style="color:var(--orange-deep);">${window.CypherConfig ? CypherConfig.whatsappDisplay : "+233 20 407 8079"}</a>
          &nbsp;·&nbsp;
          <a href="${window.CypherConfig ? CypherConfig.telLink(2) : "tel:+233241557271"}" style="color:var(--orange-deep);">${window.CypherConfig ? CypherConfig.whatsapp2Display : "+233 24 155 7271"}</a>
        </p>
      </div>
    </div>

    ${specsRows ? `
    <div class="specs-section">
      <h2 class="section-title">Specifications</h2>
      <table class="specs-table">${specsRows}</table>
    </div>` : ""}

    ${related.length ? `
    <div class="related-section">
      <h2 class="section-title">You may also like</h2>
      <div class="related-grid">${relatedHtml}</div>
    </div>` : ""}
  `;
}

function setGalleryImage(idx) {
  const imgs = window._galleryImgs || [];
  if (!imgs.length) return;
  idx = ((idx % imgs.length) + imgs.length) % imgs.length;
  window._galleryIndex = idx;
  const main = document.getElementById("gallery-main-img");
  if (main) main.src = imgs[idx];
  document.querySelectorAll(".gallery-thumb").forEach((t, i) => {
    t.classList.toggle("active", i === idx);
  });
  const count = document.getElementById("gallery-count");
  if (count) count.textContent = (idx + 1) + " / " + imgs.length;
}

function shiftGallery(dir) {
  setGalleryImage((window._galleryIndex || 0) + dir);
}

document.addEventListener("DOMContentLoaded", function () {
  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");
  const product = id ? CypherProducts.getById(id) : null;

  if (!product) {
    document.getElementById("page-content").innerHTML = `
      <div class="not-found">
        <h1>Product not found</h1>
        <p style="margin-bottom:20px;color:var(--ink-soft)">This item may have been removed or the link is incorrect.</p>
        <a href="index.html">← Back to shop</a>
      </div>`;
    return;
  }
  renderProduct(product);
});
</script>
</body>
</html>
